name: ForgeJS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a run on main mid-release, or the release is created but never published
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  index:
    uses: ./.github/workflows/library.yml
    with:
      node_version: '22'
      working_directory: '.'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write

  pages:
    uses: ./.github/workflows/website.yml
    with:
      node_version: '22'
      working_directory: 'docs'
      enable_secrets: false
      run_tests: false
      enable_versioning: false
      # the library job already auto-merges this repo's PRs
      auto_merge: false
      # distinct from the library job's 'dist' artifact in the same run
      artifact_name: 'pages-dist'
    permissions:
      contents: write
      id-token: write
      pages: write
      pull-requests: write
