name: index

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # sent by the merge pipeline, as a merge it makes starts no push run on main
  repository_dispatch:
    types: [auto-merged]
  # weekly, for scorecard
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  # a pull request's newer run replaces its older one; every other run has a group of its own, so a run on
  # main, running or queued, is never cancelled and a release is never created without being published
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Each job calls one pipeline, so the run page reads <pipeline> / <stage>. Pull requests run the checks
# (library for the tool, website for docs/); main runs version, and on a release checks the tool again
# before publishing it; the site deploys from every change to main that touches it.

jobs:
  # Which pipelines this change needs: the tool's runs unless only docs/ changed, and the
  # docs site's runs when docs/ or anything it builds from changed.
  changes:
    name: changes
    # the weekly run only scores
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find what changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # the site's lint extends configs/ and installs this package
          DOCS_INPUTS: '^(docs/|\.github/|configs/|package\.json$)'
        run: |
          # a manual or dispatched run, a new branch or a rewritten history has no base to compare with
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = repository_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qv '^docs/'; then code=true; else code=false; fi
          if printf '%s\n' "$files" | grep -qE "$DOCS_INPUTS"; then docs=true; else docs=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "docs=$docs" | tee -a "$GITHUB_OUTPUT"

  version:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/version.yml
    # empty unless set, so release-please uses GITHUB_TOKEN
    with:
      app_client_id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write

  # a pull request's checks, the release pull request's included, and on main the release's
  library:
    needs: [changes, version]
    if: >-
      !cancelled() && needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || needs.version.outputs.new_release_published == 'true')
    uses: ./.github/workflows/library.yml
    permissions:
      contents: read
      packages: read
      pull-requests: write

  # the tarball the release published, with its build provenance, so it can be checked with gh attestation verify.
  # A caller grants the union of what the called jobs ask for: package asks for packages: write alone, so only
  # attest, which takes the caller's grant, holds id-token and attestations
  publish:
    needs: [version, library]
    if: >-
      !cancelled() && needs.library.result == 'success' &&
      needs.version.outputs.new_release_published == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      # artifact attestations need a public repository on a free plan
      attest: ${{ github.event.repository.private == false }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # the docs site isn't versioned, so it's checked on every change that touches it, and deployed from main
  website:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/website.yml
    with:
      working_directory: 'docs'
      enable_secrets: false
      run_tests: false
      # the site's internal links; it's served under /forgejs/ on GitHub Pages
      check_links: true
      base_path: '/forgejs/'
      # distinct from the library's 'dist' artifact in the same run
      artifact_name: 'pages-dist'
    permissions:
      contents: read
      packages: read
      pull-requests: write

  # GitHub Pages needs a public repository on a free plan; a paid plan can drop the visibility check
  pages:
    needs: website
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      github.event.repository.private == false
    uses: ./.github/workflows/pages.yml
    with:
      artifact_name: 'pages-dist'
    permissions:
      pages: write
      id-token: write

  # OpenSSF Scorecard's checks of this repository's practices, in the Security tab, from main and weekly: only
  # when public, as a private repository needs GitHub Code Security for the upload. A scheduled run's event
  # carries no repository, so it reads the visibility from the run's context instead
  scorecard:
    name: scorecard
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false) ||
      (github.event_name == 'schedule' && github.repository_visibility == 'public')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # the results, to code scanning
      security-events: write
      # the workflow runs Scorecard reads
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Score with Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Upload the results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif

  # Dependabot's pull requests: a review request, and a squash merge when the checks passed
  merge:
    needs: [changes, library, website]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/merge.yml
    with:
      checks_passed: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: write
      pull-requests: write
