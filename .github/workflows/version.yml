name: NodeJS Version

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      node_version:
        required: false
        type: string
        description: "Node.js version; empty reads the project's .nvmrc, else Node 24"
        default: ''
      working_directory:
        required: false
        type: string
        default: '.'
      reviewers:
        description: "Comma-separated logins to request a review of the release pull request from; empty means the repository's owner"
        required: false
        type: string
        default: ''
    outputs:
      new_release_published:
        description: "Whether a new release was published"
        value: ${{ format('{0}', jobs.release-please.outputs.release_created == 'true' || jobs.release-please.outputs.release_created == true || (inputs.working_directory == '.' && (jobs.release-please.outputs.releases_created == 'true' || jobs.release-please.outputs.releases_created == true))) }}
      version:
        description: "Released version (e.g. 1.2.3); empty when nothing was released"
        value: ${{ jobs.release-please.outputs.version }}
      tag_name:
        description: "Released tag (e.g. v1.2.3); empty when nothing was released"
        value: ${{ jobs.release-please.outputs.tag_name }}

jobs:
  release-please:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    # release-please prefixes a package's outputs with its path (`services/api--version`)
    # unless the package is the repository root, so read this package's own: a
    # release of another package in the repository isn't this one's.
    # releases_created (any package released) only counts for the root package,
    # where release_created can be unset after a release (website deploys were
    # skipped without it).
    outputs:
      release_created: ${{ inputs.working_directory != '.' && steps.release.outputs[format('{0}--release_created', inputs.working_directory)] || steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ inputs.working_directory != '.' && steps.release.outputs[format('{0}--version', inputs.working_directory)] || steps.release.outputs.version }}
      tag_name: ${{ inputs.working_directory != '.' && steps.release.outputs[format('{0}--tag_name', inputs.working_directory)] || steps.release.outputs.tag_name }}
      # the release pull request release-please opened or updated, if any
      pr_number: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
    steps:
      # a project can keep a release-please config in <working_directory>/.github
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: ${{ inputs.working_directory }}/.github
      - name: Find the release-please config
        id: config
        env:
          DIR: ${{ inputs.working_directory }}
        # release-please reads them through the GitHub API, which takes paths
        # from the repository root without a leading ./
        run: |
          case "$DIR" in
            . | ./) github=.github ;;
            *) github="${DIR#./}/.github" ;;
          esac
          if [ -f "$github/release.json" ]; then
            echo "file=$github/release.json" >> "$GITHUB_OUTPUT"
            echo "manifest=$github/.release.json" >> "$GITHUB_OUTPUT"
          fi
      # with a config, release-please reads the packages and options from it;
      # without one, it releases working_directory as a Node.js package
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: ${{ steps.config.outputs.file == '' && 'node' || '' }}
          config-file: ${{ steps.config.outputs.file }}
          manifest-file: ${{ steps.config.outputs.manifest }}
          # empty means the repository root; a config keys its packages by path instead
          path: ${{ steps.config.outputs.file == '' && inputs.working_directory != '.' && inputs.working_directory || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  review:
    needs: [release-please]
    if: needs.release-please.outputs.pr_number != ''
    uses: ./.github/workflows/review.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      pull_request: ${{ needs.release-please.outputs.pr_number }}
      reviewers: ${{ inputs.reviewers }}
    permissions:
      pull-requests: write
