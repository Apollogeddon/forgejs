name: version

# release-please: opens or updates the release pull request, and cuts the release when it merges.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      node_version:
        required: false
        type: string
        description: "Node.js version; empty reads the project's .nvmrc, else Node 24"
        default: ''
      working_directory:
        required: false
        type: string
        default: '.'
      reviewers:
        description: "Comma-separated logins to request a review of the release pull request from; empty means the repository's owner"
        required: false
        type: string
        default: ''
    outputs:
      new_release_published:
        description: "Whether a new release was published"
        value: ${{ format('{0}', jobs.release.outputs.release_created == 'true' || jobs.release.outputs.release_created == true || (inputs.working_directory == '.' && (jobs.release.outputs.releases_created == 'true' || jobs.release.outputs.releases_created == true))) }}
      version:
        description: "Released version (e.g. 1.2.3); empty when nothing was released"
        value: ${{ jobs.release.outputs.version }}
      tag_name:
        description: "Released tag (e.g. v1.2.3); empty when nothing was released"
        value: ${{ jobs.release.outputs.tag_name }}

jobs:
  release:
    name: release
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    # release-please prefixes a package's outputs with its path (`services/api--version`)
    # unless the package is the repository root, so read this package's own: a
    # release of another package in the repository isn't this one's.
    # releases_created (any package released) only counts for the root package,
    # where release_created can be unset after a release (website deploys were
    # skipped without it).
    outputs:
      release_created: ${{ inputs.working_directory != '.' && steps.release.outputs[format('{0}--release_created', inputs.working_directory)] || steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ inputs.working_directory != '.' && steps.release.outputs[format('{0}--version', inputs.working_directory)] || steps.release.outputs.version }}
      tag_name: ${{ inputs.working_directory != '.' && steps.release.outputs[format('{0}--tag_name', inputs.working_directory)] || steps.release.outputs.tag_name }}
    steps:
      # a project can keep a release-please config in <working_directory>/.github
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: ${{ inputs.working_directory }}/.github
      - name: Find the release-please config
        id: config
        env:
          DIR: ${{ inputs.working_directory }}
        # release-please reads them through the GitHub API, which takes paths
        # from the repository root without a leading ./
        run: |
          case "$DIR" in
            . | ./) github=.github ;;
            *) github="${DIR#./}/.github" ;;
          esac
          if [ -f "$github/release.json" ]; then
            echo "file=$github/release.json" >> "$GITHUB_OUTPUT"
            echo "manifest=$github/.release.json" >> "$GITHUB_OUTPUT"
          fi
      # with a config, release-please reads the packages and options from it;
      # without one, it releases working_directory as a Node.js package
      - name: Release
        uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: ${{ steps.config.outputs.file == '' && 'node' || '' }}
          config-file: ${{ steps.config.outputs.file }}
          manifest-file: ${{ steps.config.outputs.manifest }}
          # empty means the repository root; a config keys its packages by path instead
          path: ${{ steps.config.outputs.file == '' && inputs.working_directory != '.' && inputs.working_directory || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # CODEOWNERS only requests reviews in a private repository on a paid plan, so the release
      # pull request asks for one here instead, on any plan
      - name: Request a review
        if: steps.release.outputs.pr != ''
        uses: actions/github-script@v9
        env:
          PULL_REQUEST: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number || '' }}
          REVIEWERS: ${{ inputs.reviewers }}
        with:
          script: |
            const number = Number(process.env.PULL_REQUEST || context.payload.pull_request?.number);
            if (!number) return core.notice('No pull request to request a review on');
            let reviewers = process.env.REVIEWERS.split(',').map((login) => login.trim()).filter(Boolean);
            if (reviewers.length === 0) {
              // an organisation can't be requested, and names its reviewers through the input instead
              const { data: repo } = await github.rest.repos.get(context.repo);
              if (repo.owner.type !== 'User') return core.notice('The owner is an organisation; set reviewers to request one');
              reviewers = [repo.owner.login];
            }
            // a review request is a courtesy, never a check: a failure here mustn't fail the pipeline
            try {
              await github.rest.pulls.requestReviewers({ ...context.repo, pull_number: number, reviewers });
              core.info(`Requested a review from ${reviewers.join(', ')} on #${number}`);
            } catch (error) {
              core.warning(`Couldn't request a review on #${number}: ${error.message}`);
            }
