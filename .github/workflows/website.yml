name: NodeJS Website

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      test_on_push:
        description: "Run the checks on pushes too; false runs them on pull requests (and scheduled runs) only"
        required: false
        type: boolean
        default: true
      test_release_prs:
        description: "Run the checks on release-please's release pull requests"
        required: false
        type: boolean
        default: true
      enable_secrets:
        required: false
        type: boolean
        default: true
      node_version:
        required: false
        type: string
        description: "Node.js version; empty reads the project's .nvmrc, else Node 24"
        default: ''
      working_directory:
        required: false
        type: string
        default: '.'
      auto_patch:
        required: false
        type: boolean
        default: true
      build_env_vars:
        required: false
        type: string
        default: ''
      artifact_name:
        required: false
        type: string
        default: 'dist'
      run_tests:
        required: false
        type: boolean
        default: true
      enable_versioning:
        required: false
        type: boolean
        default: true
      auto_merge:
        required: false
        type: boolean
        default: true
      reviewers:
        description: "Comma-separated logins to request a review of Dependabot's and release-please's pull requests from; empty means the repository's owner"
        required: false
        type: string
        default: ''
      ref:
        description: "Commit, branch or tag to check out; empty means the commit that triggered the run"
        required: false
        type: string
        default: ''
      setup_go:
        description: "Go to install before pre_build_command: a version (e.g. 1.25.x) or a go.mod, go.work, .go-version or .tool-versions path from the repository root; empty installs none"
        required: false
        type: string
        default: ''
      pre_build_command:
        description: "Shell command run in working_directory before installing dependencies, in every job that does; GH_TOKEN holds the GH_TOKEN secret if passed"
        required: false
        type: string
        default: ''
      base_path:
        description: "The path the site is served under, e.g. /my-repo/ for a GitHub Pages project site, so the site checks resolve root-relative links; empty means /"
        required: false
        type: string
        default: ''
      check_links:
        description: "Check the built site's links with lychee; internal links only unless check_external_links"
        required: false
        type: boolean
        default: false
      check_external_links:
        description: "With check_links, check links to other sites too"
        required: false
        type: boolean
        default: false
      link_check_args:
        description: "Extra lychee arguments, e.g. --include-fragments or --exclude <pattern>"
        required: false
        type: string
        default: ''
      check_accessibility:
        description: "Check the built site against WCAG 2.2 A and AA with axe, in a headless Chromium"
        required: false
        type: boolean
        default: false
      accessibility_paths:
        description: "Comma- or newline-separated pages to check, relative to base_path; empty checks every page in the sitemap, else the home page"
        required: false
        type: string
        default: ''
      accessibility_impact:
        description: "The lowest axe impact that fails the check (minor, moderate, serious or critical); lower ones are reported as warnings"
        required: false
        type: string
        default: 'serious'
      review_dependabot:
        description: "Request a review on Dependabot's pull requests; turn off when another pipeline in the same run already does"
        required: false
        type: boolean
        default: true
    secrets:
      GH_TOKEN:
        description: "A token pre_build_command can use, as GH_TOKEN"
        required: false
    outputs:
      new_release_published:
        description: "Whether a new release was published"
        value: ${{ jobs.version.outputs.new_release_published }}
      version:
        description: "Released version (e.g. 1.2.3); empty when nothing was released"
        value: ${{ jobs.version.outputs.version }}
      tag_name:
        description: "Released tag (e.g. v1.2.3); empty when nothing was released"
        value: ${{ jobs.version.outputs.tag_name }}

jobs:
  testing:
    # With test_on_push false, a push checks only when a release is made, in release-testing.
    # Without versioning every push deploys, and only these checks build what it deploys, so they always run.
    if: >-
      (github.event_name != 'push' || inputs.test_on_push || !inputs.enable_versioning) &&
      (inputs.test_release_prs || !startsWith(github.head_ref, 'release-please--'))
    uses: ./.github/workflows/testing.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      node_version: ${{ inputs.node_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      auto_patch: ${{ inputs.auto_patch }}
      build_env_vars: ${{ inputs.build_env_vars }}
      artifact_name: ${{ inputs.artifact_name }}
      run_tests: ${{ inputs.run_tests }}
      ref: ${{ inputs.ref }}
      setup_go: ${{ inputs.setup_go }}
      pre_build_command: ${{ inputs.pre_build_command }}
      base_path: ${{ inputs.base_path }}
      check_links: ${{ inputs.check_links }}
      check_external_links: ${{ inputs.check_external_links }}
      link_check_args: ${{ inputs.link_check_args }}
      check_accessibility: ${{ inputs.check_accessibility }}
      accessibility_paths: ${{ inputs.accessibility_paths }}
      accessibility_impact: ${{ inputs.accessibility_impact }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # Dependabot's pull requests ask for a review as they open, before the checks, so a failing
  # update reaches the reviewer too
  review:
    if: inputs.review_dependabot && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/review.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      reviewers: ${{ inputs.reviewers }}
    permissions:
      pull-requests: write

  auto-merge:
    uses: ./.github/workflows/merge.yml
    with:
      runs_on: ${{ inputs.runs_on }}
    needs: [testing]
    if: inputs.auto_merge
    permissions:
      contents: write
      pull-requests: write

  version:
    # Runs when the checks were skipped, as on a push to main with test_on_push false, but not when they failed.
    if: ${{ !failure() && !cancelled() && inputs.enable_versioning }}
    uses: ./.github/workflows/version.yml
    needs: [testing]
    with:
      runs_on: ${{ inputs.runs_on }}
      node_version: ${{ inputs.node_version }}
      working_directory: ${{ inputs.working_directory }}
      reviewers: ${{ inputs.reviewers }}

  release-testing:
    # With test_on_push false, a push to main is checked and built only when release-please made a release.
    needs: [version]
    if: >-
      !cancelled() && github.event_name == 'push' && !inputs.test_on_push &&
      (needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true)
    uses: ./.github/workflows/testing.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      node_version: ${{ inputs.node_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      auto_patch: ${{ inputs.auto_patch }}
      build_env_vars: ${{ inputs.build_env_vars }}
      artifact_name: ${{ inputs.artifact_name }}
      run_tests: ${{ inputs.run_tests }}
      ref: ${{ inputs.ref }}
      setup_go: ${{ inputs.setup_go }}
      pre_build_command: ${{ inputs.pre_build_command }}
      base_path: ${{ inputs.base_path }}
      check_links: ${{ inputs.check_links }}
      check_external_links: ${{ inputs.check_external_links }}
      link_check_args: ${{ inputs.link_check_args }}
      check_accessibility: ${{ inputs.check_accessibility }}
      accessibility_paths: ${{ inputs.accessibility_paths }}
      accessibility_impact: ${{ inputs.accessibility_impact }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  deploy:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    needs: [testing, version, release-testing]
    # !failure() rather than success(), so a skipped version or checks job doesn't skip the deploy
    if: |
      !failure() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (needs.testing.result == 'success' || needs['release-testing'].result == 'success') &&
      (needs.version.result == 'success' || needs.version.result == 'skipped') &&
      (!inputs.enable_versioning || needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true)
    # one deploy at a time, and a waiting one is replaced by a newer one rather than overtaking a running
    # one; not named pages, which a caller copying GitHub's starter workflow uses, as a shared group deadlocks
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ./pages-artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages-artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
