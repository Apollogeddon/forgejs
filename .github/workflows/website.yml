name: NodeJS Website

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      test_release_prs:
        description: "Run the checks on release-please's release pull requests"
        required: false
        type: boolean
        default: true
      enable_secrets:
        required: false
        type: boolean
        default: true
      node_version:
        required: false
        type: string
        default: '22'
      working_directory:
        required: false
        type: string
        default: '.'
      auto_patch:
        required: false
        type: boolean
        default: true
      build_env_vars:
        required: false
        type: string
        default: ''
      artifact_name:
        required: false
        type: string
        default: 'dist'
      run_tests:
        required: false
        type: boolean
        default: true
      enable_versioning:
        required: false
        type: boolean
        default: true
      auto_merge:
        required: false
        type: boolean
        default: true
    outputs:
      new_release_published:
        description: "Whether a new release was published"
        value: ${{ jobs.version.outputs.new_release_published }}
      version:
        description: "Released version (e.g. 1.2.3); empty when nothing was released"
        value: ${{ jobs.version.outputs.version }}
      tag_name:
        description: "Released tag (e.g. v1.2.3); empty when nothing was released"
        value: ${{ jobs.version.outputs.tag_name }}

jobs:
  testing:
    # Pushes to main always run the checks: `deploy` takes the artifact they build in the same run.
    if: inputs.test_release_prs || !startsWith(github.head_ref, 'release-please--')
    uses: ./.github/workflows/testing.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      node_version: ${{ inputs.node_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      auto_patch: ${{ inputs.auto_patch }}
      build_env_vars: ${{ inputs.build_env_vars }}
      artifact_name: ${{ inputs.artifact_name }}
      run_tests: ${{ inputs.run_tests }}

  auto-merge:
    uses: ./.github/workflows/merge.yml
    with:
      runs_on: ${{ inputs.runs_on }}
    needs: [testing]
    if: inputs.auto_merge
    permissions:
      contents: write
      pull-requests: write

  version:
    if: inputs.enable_versioning
    uses: ./.github/workflows/version.yml
    needs: [testing]
    with:
      runs_on: ${{ inputs.runs_on }}
      node_version: ${{ inputs.node_version }}
      working_directory: ${{ inputs.working_directory }}

  deploy:
    runs-on: ${{ inputs.runs_on }}
    needs: [testing, version]
    # always() so a skipped version job (enable_versioning: false) doesn't skip the deploy
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.testing.result == 'success' &&
      (needs.version.result == 'success' || needs.version.result == 'skipped') &&
      (!inputs.enable_versioning || needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ./pages-artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
