name: debian

# Packages the build, the artifact service.yml uploaded earlier in the run, as a .deb with Snodeb, and checks it.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        description: "Directory holding package.json"
        required: false
        type: string
        default: '.'
      node_version:
        description: "Node.js version; empty reads the project's .nvmrc, else Node 24"
        required: false
        type: string
        default: ''
      artifact_name:
        description: "The build artifact to package, as service.yml's artifact_name"
        required: false
        type: string
        default: 'dist'
    outputs:
      package_artifact:
        description: "The artifact holding the .deb, for publish.yml's assets"
        value: debian-package

jobs:
  build:
    name: build
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/dist
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node version
        id: node
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
          # no dependency cache for the release build, as a poisoned cache would be packaged
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          if [ -f .env.production ]; then
            cp .env.production .env
          else
            echo "No .env.production found"
          fi

          npx snodeb

          mkdir -p deb_output
          mv ./deb/*.deb ./deb_output/
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: ${{ inputs.working_directory }}/deb_output/*.deb
          if-no-files-found: error

  # the archive reads back with its control fields and files, so a broken package fails before it ships
  test:
    name: test
    needs: [build]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: ${{ runner.temp }}/deb
      - name: Test
        working-directory: ${{ runner.temp }}/deb
        run: |
          for deb in *.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" > /dev/null
            for field in Package Version Architecture; do
              [ -n "$(dpkg-deb --field "$deb" "$field")" ] || { echo "::error::$deb has no $field"; exit 1; }
            done
          done
