name: publish

# Ships a release: the package to GitHub Packages, files attached to the GitHub release, and their build provenance.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        description: "Directory holding package.json"
        required: false
        type: string
        default: '.'
      node_version:
        description: "Node.js version; empty reads the project's .nvmrc, else Node 24"
        required: false
        type: string
        default: ''
      artifact_name:
        description: "The build artifact to pack, as library.yml's artifact_name"
        required: false
        type: string
        default: 'dist'
      package:
        description: "Pack the build and publish it to GitHub Packages; needs packages: write"
        required: false
        type: boolean
        default: true
      assets:
        description: "An artifact whose files to attach to the release tag_name names, e.g. debian.yml's debian-package; needs contents: write"
        required: false
        type: string
        default: ''
      tag_name:
        description: "The release to attach assets to, as version.yml's tag_name"
        required: false
        type: string
        default: ''
      attest:
        description: "Attest the build provenance of the published tarball and assets; needs id-token: write and attestations: write"
        required: false
        type: boolean
        default: false
    outputs:
      published:
        description: "Whether the package was published in this run"
        value: ${{ jobs.package.outputs.published }}
      package_artifact:
        description: "The artifact holding the published tarball; empty when nothing was published"
        value: ${{ jobs.package.outputs.artifact }}

# GitHub checks a called workflow's permissions against its caller's before running any of it, even a job
# that will be skipped, so each stage takes the caller's grant instead of asking for its own: a caller grants
# packages: write for package, contents: write for assets, and id-token: write and attestations: write for
# attest, only for the stages it turns on.

jobs:
  package:
    name: package
    if: inputs.package
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    outputs:
      published: ${{ steps.publish.outputs.published }}
      artifact: ${{ steps.publish.outputs.artifact }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/dist
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node version
        id: node
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
          # no dependency cache in a job holding a publish token, as a poisoned cache could ship
          package-manager-cache: false
      # publishes the tested build artifact as is: no install and no lifecycle scripts,
      # so no dependency code runs while the publish token is set
      - name: Pack
        id: pack
        # into a directory of its own, so the tarball is the one file there
        run: |
          dir="$RUNNER_TEMP/package"
          rm -rf "$dir"
          mkdir -p "$dir"
          npm pack --ignore-scripts --pack-destination "$dir"
          tarball=$(find "$dir" -maxdepth 1 -name '*.tgz' -print -quit)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      # the packed tarball itself, so what's published is byte for byte what attest can attest
      - name: Publish to GitHub Packages
        id: publish
        run: |
          npm publish "$TARBALL" --ignore-scripts
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          ARTIFACT: ${{ inputs.artifact_name }}-package
      - name: Upload the published tarball
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  assets:
    name: assets
    if: inputs.assets != ''
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - name: Download the assets
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.assets }}
          path: ${{ runner.temp }}/assets
      # Through the API rather than the gh CLI, which a self-hosted runner may not have
      - name: Upload the assets to the release
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          ASSETS: ${{ runner.temp }}/assets
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const tag = process.env.TAG_NAME;
            if (!tag) throw new Error('assets needs tag_name, the release to attach them to');
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            for (const name of fs.readdirSync(process.env.ASSETS)) {
              const file = path.join(process.env.ASSETS, name);
              if (!fs.statSync(file).isFile()) continue;
              // a re-run replaces what an earlier attempt attached
              const existing = release.assets.find((asset) => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: existing.id });
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(file),
                headers: { 'content-type': 'application/octet-stream', 'content-length': fs.statSync(file).size },
              });
              core.info(`Attached ${name} to ${tag}`);
            }

  # npm's --provenance only works with the public npm registry, so the published files are attested here
  attest:
    name: attest
    needs: [package, assets]
    if: >-
      !cancelled() && inputs.attest &&
      !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - name: Download the published tarball
        if: needs.package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/attest
      - name: Download the assets
        if: needs.assets.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.assets }}
          path: ${{ runner.temp }}/attest
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/attest/*
