name: service

# A service's checks: lint, scan, test and build. docker.yml and debian.yml package the build.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        description: "Directory holding package.json"
        required: false
        type: string
        default: '.'
      node_version:
        description: "Node.js version; empty reads the project's .nvmrc, else Node 24"
        required: false
        type: string
        default: ''
      enable_secrets:
        description: "Scan for secrets with Gitleaks"
        required: false
        type: boolean
        default: true
      run_tests:
        description: "Run the test suite; init --no-testing sets it to false"
        required: false
        type: boolean
        default: true
      build_env_vars:
        description: "Lines written to .env before the build"
        required: false
        type: string
        default: ''
      artifact_name:
        description: "The build artifact's name, which the publish, debian, deploy and check stages download"
        required: false
        type: string
        default: 'dist'
      ref:
        description: "Commit, branch or tag to check out; empty means the commit that triggered the run"
        required: false
        type: string
        default: ''
      setup_go:
        description: "Go to install before pre_build_command: a version (e.g. 1.25.x) or a go.mod, go.work, .go-version or .tool-versions path from the repository root; empty installs none"
        required: false
        type: string
        default: ''
      pre_build_command:
        description: "Shell command run in working_directory before installing dependencies, in every job that does; GH_TOKEN holds the GH_TOKEN secret if passed"
        required: false
        type: string
        default: ''
    secrets:
      GH_TOKEN:
        description: "A token pre_build_command can use, as GH_TOKEN"
        required: false

jobs:
  lint:
    name: lint
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node version
        id: node
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@v7
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # a project scaffolded with --no-linting has no Biome config to lint against
      - name: Lint
        run: |
          if [ -f biome.json ] || [ -f biome.jsonc ]; then
            npx @biomejs/biome ci .
          else
            echo "No biome.json, skipping Biome"
          fi
      - name: Check types
        run: npm run type

  scan:
    name: scan
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      # Gitleaks comments on the pull request it finds a secret in
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scan with Gitleaks
        if: inputs.enable_secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A high or critical finding (CVSS 7 or more) fails a pull request; elsewhere it's annotated
      # instead, so releases and the patch pipeline that fixes it still run. Accept one with an
      # IgnoredVulns entry in an osv-scanner.toml beside the lockfile
      - name: Scan with OSV
        id: osv
        run: |
          curl -sL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv-scanner"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          # 0: nothing found, 1: vulnerabilities found, 128: no lockfile, anything else: no scan
          status=0
          "$RUNNER_TEMP/osv-scanner" scan source -r --format json --output-file "$RUNNER_TEMP/osv.json" . || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/osv-scanner"
      - name: Report OSV findings
        uses: actions/github-script@v9
        env:
          OSV_STATUS: ${{ steps.osv.outputs.status }}
          OSV_REPORT: ${{ runner.temp }}/osv.json
          OSV_ENFORCE: ${{ github.event_name == 'pull_request' }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const status = Number(process.env.OSV_STATUS);
            if (status === 128) {
              core.info('No lockfiles to scan');
              return;
            }
            if ((status !== 0 && status !== 1) || !fs.existsSync(process.env.OSV_REPORT)) {
              core.warning(`OSV-Scanner couldn't finish (exit ${status}), so dependencies weren't checked; see the scan step's log`, { title: 'OSV scan incomplete' });
              return;
            }
            const report = JSON.parse(fs.readFileSync(process.env.OSV_REPORT, 'utf8'));
            // a GitHub advisory's rating when an advisory has no CVSS score
            const ratings = { CRITICAL: 9, HIGH: 7, MODERATE: 4, MEDIUM: 4, LOW: 1 };
            const rows = [];
            let blocking = 0;
            for (const result of report.results ?? []) {
              const file = path.relative(process.env.GITHUB_WORKSPACE, result.source.path);
              for (const { package: pkg, vulnerabilities = [], groups = [] } of result.packages ?? []) {
                for (const group of groups) {
                  const vulns = vulnerabilities.filter((v) => group.ids.includes(v.id));
                  let score = Number.parseFloat(group.max_severity);
                  if (Number.isNaN(score)) {
                    score = Math.max(0, ...vulns.map((v) => ratings[String(v.database_specific?.severity).toUpperCase()] ?? 0));
                  }
                  const high = score >= 7;
                  const message = `${pkg.name} ${pkg.version}: ${group.ids.join(', ')} ${vulns[0]?.summary ?? ''} (severity ${score || 'unknown'})`;
                  if (high) {
                    blocking++;
                    core.error(message, { title: 'High or critical vulnerability', file });
                  } else {
                    core.warning(message, { title: 'Vulnerability', file });
                  }
                  rows.push([file, `${pkg.name} ${pkg.version}`, group.ids.join(', '), String(score || 'unknown')]);
                }
              }
            }
            if (rows.length) {
              await core.summary
                .addHeading('OSV-Scanner findings', 3)
                .addTable([['Lockfile', 'Package', 'Advisories', 'Severity'], ...rows])
                .write();
            }
            const found = `${blocking} high or critical ${blocking === 1 ? 'vulnerability' : 'vulnerabilities'}`;
            if (blocking && process.env.OSV_ENFORCE === 'true') {
              core.setFailed(`${found}: update the packages, or record an accepted one in osv-scanner.toml`);
            } else if (blocking) {
              core.warning(`${found}: this fails pull requests until they're updated, as the patch job may do`, { title: 'OSV scan' });
            } else {
              core.info(`${rows.length} found, none high or critical`);
            }


  test:
    name: test
    if: inputs.run_tests
    needs: [lint, scan]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node version
        id: node
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@v7
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: npm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/coverage
          if-no-files-found: ignore

  build:
    name: build
    # only needs the lint and scan to pass, so it runs alongside the tests
    needs: [lint, scan]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node version
        id: node
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@v7
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the build environment
        if: inputs.build_env_vars != ''
        # through the environment, so the value is never parsed as part of the script
        env:
          BUILD_ENV_VARS: ${{ inputs.build_env_vars }}
        run: printf '%s\n' "$BUILD_ENV_VARS" >> .env
      - name: Build
        run: npm run build
      # publint checks the built package and docs:check the generated API docs; projects without
      # these scripts skip them
      - name: Check the package
        run: |
          npm run --if-present publint
          npm run --if-present docs:check
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/dist
