name: Build Provenance

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      artifact:
        description: "The artifact whose files to attest, e.g. library.yml's package_artifact output"
        required: true
        type: string

# A job of its own, called by the project's index.yml, so only a caller that opts in grants
# id-token and attestations: GitHub checks a called workflow's permissions before running any of it.

jobs:
  attest:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/attest
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/attest/*
