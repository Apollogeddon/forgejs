name: NodeJS Quality

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        required: false
        type: string
        default: '.'
      node_version:
        required: false
        type: string
        description: "Node.js version; empty reads the project's .nvmrc, else Node 24"
        default: ''
      enable_secrets:
        required: false
        type: boolean
        default: true
      ref:
        description: "Commit, branch or tag to check out; empty means the commit that triggered the run"
        required: false
        type: string
        default: ''
      setup_go:
        description: "Go to install before pre_build_command: a version (e.g. 1.25.x) or a go.mod, go.work, .go-version or .tool-versions path from the repository root; empty installs none"
        required: false
        type: string
        default: ''
      pre_build_command:
        description: "Shell command run in working_directory before installing dependencies, in every job that does; GH_TOKEN holds the GH_TOKEN secret if passed"
        required: false
        type: string
        default: ''
    secrets:
      GH_TOKEN:
        description: "A token pre_build_command can use, as GH_TOKEN"
        required: false

jobs:
  secure:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks Scan
        if: inputs.enable_secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: OSV Scan
        run: |
          curl -sL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner scan source -r . || true
          rm osv-scanner

  linting:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node.js version
        id: node
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@v7
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # a project scaffolded with --no-linting has no Biome config to lint against
      - name: Biome Lint
        run: |
          if [ -f biome.json ] || [ -f biome.jsonc ]; then
            npx @biomejs/biome ci .
          else
            echo "No biome.json, skipping Biome"
          fi
      - name: Type Check
        run: npm run type
