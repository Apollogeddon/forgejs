name: NodeJS Tests

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        required: false
        type: string
        default: '.'
      node_version:
        required: false
        type: string
        description: "Node.js version; empty reads the project's .nvmrc, else Node 24"
        default: ''
      enable_secrets:
        required: false
        type: boolean
        default: true
      auto_patch:
        required: false
        type: boolean
        default: true
      build_env_vars:
        required: false
        type: string
        default: ''
      run_tests:
        required: false
        type: boolean
        default: true
      artifact_name:
        required: false
        type: string
        default: 'dist'
      ref:
        description: "Commit, branch or tag to check out; empty means the commit that triggered the run"
        required: false
        type: string
        default: ''
      setup_go:
        description: "Go to install before pre_build_command: a version (e.g. 1.25.x) or a go.mod, go.work, .go-version or .tool-versions path from the repository root; empty installs none"
        required: false
        type: string
        default: ''
      pre_build_command:
        description: "Shell command run in working_directory before installing dependencies, in every job that does; GH_TOKEN holds the GH_TOKEN secret if passed"
        required: false
        type: string
        default: ''
      base_path:
        description: "The path the site is served under, e.g. /my-repo/ for a GitHub Pages project site, so the site checks resolve root-relative links; empty means /"
        required: false
        type: string
        default: ''
      check_links:
        description: "Check the built site's links with lychee; internal links only unless check_external_links"
        required: false
        type: boolean
        default: false
      check_external_links:
        description: "With check_links, check links to other sites too"
        required: false
        type: boolean
        default: false
      link_check_args:
        description: "Extra lychee arguments, e.g. --include-fragments or --exclude <pattern>"
        required: false
        type: string
        default: ''
      check_accessibility:
        description: "Check the built site against WCAG 2.2 A and AA with axe, in a headless Chromium"
        required: false
        type: boolean
        default: false
      accessibility_paths:
        description: "Comma- or newline-separated pages to check, relative to base_path; empty checks every page in the sitemap, else the home page"
        required: false
        type: string
        default: ''
      accessibility_impact:
        description: "The lowest axe impact that fails the check (minor, moderate, serious or critical); lower ones are reported as warnings"
        required: false
        type: string
        default: 'serious'
    secrets:
      GH_TOKEN:
        description: "A token pre_build_command can use, as GH_TOKEN"
        required: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      node_version: ${{ inputs.node_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      ref: ${{ inputs.ref }}
      setup_go: ${{ inputs.setup_go }}
      pre_build_command: ${{ inputs.pre_build_command }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  testing:
    runs-on: ${{ inputs.runs_on }}
    if: inputs.run_tests
    timeout-minutes: 10
    needs: [quality]
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node.js version
        id: node
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@v7
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tests
        run: npm test
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/coverage
          if-no-files-found: ignore

  build:
    runs-on: ${{ inputs.runs_on }}
    # installing a browser and visiting every page takes longer than a build
    timeout-minutes: ${{ inputs.check_accessibility && 20 || 10 }}
    # only needs the checks to pass, so it runs alongside the tests
    needs: [quality]
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node.js version
        id: node
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@v7
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Inject Environment Variables
        if: inputs.build_env_vars != ''
        # through the environment, so the value is never parsed as part of the script
        env:
          BUILD_ENV_VARS: ${{ inputs.build_env_vars }}
        run: printf '%s\n' "$BUILD_ENV_VARS" >> .env
      - name: Build
        run: npm run build
      # publint checks the built package and docs:check the generated API docs; projects without
      # these scripts skip them
      - name: Package checks
        run: |
          npm run --if-present publint
          npm run --if-present docs:check
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/dist
      # served from a copy under base_path, as the host serves it, so root-relative links resolve
      - name: Stage the site for checking
        id: site
        if: inputs.check_links || inputs.check_accessibility
        env:
          BASE_PATH: ${{ inputs.base_path }}
        run: |
          base="/${BASE_PATH#/}"
          base="${base%/}/"
          root="$RUNNER_TEMP/site"
          rm -rf "$root"
          mkdir -p "$root$base"
          cp -R dist/. "$root$base"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      # offline by default, so another site being down never fails the build; reads a lychee.toml or
      # .lycheeignore in working_directory
      - name: Check links
        if: inputs.check_links
        uses: lycheeverse/lychee-action@v2
        with:
          workingDirectory: ${{ inputs.working_directory }}
          args: >-
            --no-progress
            ${{ !inputs.check_external_links && '--offline' || '' }}
            --root-dir '${{ steps.site.outputs.root }}'
            --fallback-extensions html
            --index-files index.html
            ${{ inputs.link_check_args }}
            '${{ steps.site.outputs.root }}/**/*.html'
          output: ${{ runner.temp }}/lychee/out.md
          fail: true
          failIfEmpty: false
          jobSummary: true
      # outside the project, so its lockfile and node_modules stay as they are
      - name: Install the accessibility checker
        if: ${{ !cancelled() && inputs.check_accessibility && steps.site.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p a11y
          cd a11y
          printf '{"private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund --save-exact playwright@1.63.0 @axe-core/playwright@4.13.0
          # the browser's system libraries need root to install; a runner without sudo must have them already
          if sudo -n true 2>/dev/null; then
            npx playwright install --with-deps --only-shell chromium
          else
            npx playwright install --only-shell chromium
          fi
          cat > check.mjs <<'EOF'
          import fs from "node:fs";
          import http from "node:http";
          import path from "node:path";
          import AxeBuilder from "@axe-core/playwright";
          import { chromium } from "playwright";

          const root = process.env.SITE_ROOT;
          const base = process.env.BASE_PATH;
          const levels = ["minor", "moderate", "serious", "critical"];
          const threshold = levels.indexOf(process.env.IMPACT || "serious");
          if (threshold < 0) throw new Error(`accessibility_impact must be one of ${levels.join(", ")}`);

          const types = { ".html": "text/html", ".css": "text/css", ".js": "text/javascript", ".mjs": "text/javascript",
            ".json": "application/json", ".svg": "image/svg+xml", ".png": "image/png", ".jpg": "image/jpeg",
            ".jpeg": "image/jpeg", ".gif": "image/gif", ".webp": "image/webp", ".avif": "image/avif", ".ico": "image/x-icon",
            ".woff": "font/woff", ".woff2": "font/woff2", ".xml": "application/xml", ".txt": "text/plain" };

          // the file a URL path serves, as a static host would: a directory's index.html, or the path plus .html
          const resolve = (urlPath) => {
            const file = path.join(root, decodeURIComponent(urlPath));
            if (!file.startsWith(root + path.sep)) return undefined;
            for (const candidate of [file, path.join(file, "index.html"), `${file}.html`]) {
              if (fs.statSync(candidate, { throwIfNoEntry: false })?.isFile()) return candidate;
            }
          };

          const server = http.createServer((req, res) => {
            const file = resolve(new URL(req.url, "http://localhost").pathname);
            if (!file) return res.writeHead(404).end("Not found");
            res.writeHead(200, { "content-type": types[path.extname(file)] ?? "application/octet-stream" });
            fs.createReadStream(file).pipe(res);
          });
          await new Promise((done) => server.listen(0, "127.0.0.1", done));
          const origin = `http://127.0.0.1:${server.address().port}`;

          // the listed paths, relative to the base path; without any, every page in the sitemap, else the home page
          const sitemap = (file, seen = new Set()) => {
            if (seen.has(file) || !fs.existsSync(file)) return [];
            seen.add(file);
            const locs = [...fs.readFileSync(file, "utf8").matchAll(/<loc>\s*([^<\s]+)\s*<\/loc>/g)].map((m) => new URL(m[1]).pathname);
            return locs.flatMap((loc) => (loc.endsWith(".xml") ? sitemap(path.join(root, loc), seen) : [loc]));
          };
          const listed = (process.env.PAGES ?? "").split(/[\n,]/).map((p) => p.trim()).filter(Boolean);
          let pages = listed.map((p) => base + p.replace(/^\//, ""));
          if (pages.length === 0) {
            const site = path.join(root, base);
            const found = ["sitemap-index.xml", "sitemap.xml"].map((name) => path.join(site, name)).find(fs.existsSync);
            pages = found ? [...new Set(sitemap(found))] : [base];
            console.log(found ? `Checking ${pages.length} pages from ${path.relative(root, found)}` : "No sitemap, checking the home page");
          }

          const failures = [];
          const notes = [];
          const browser = await chromium.launch();
          try {
            const page = await (await browser.newContext()).newPage();
            for (const pagePath of pages) {
              const response = await page.goto(origin + pagePath, { waitUntil: "load" });
              if (!response?.ok()) {
                failures.push({ page: pagePath, rule: "page", impact: "critical", help: `HTTP ${response?.status()}`, nodes: [] });
                continue;
              }
              const { violations } = await new AxeBuilder({ page })
                .withTags(["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"])
                .analyze();
              for (const v of violations) {
                const entry = { page: pagePath, rule: v.id, impact: v.impact, help: v.help, url: v.helpUrl, nodes: v.nodes.map((n) => n.target.join(" ")) };
                (levels.indexOf(v.impact) >= threshold ? failures : notes).push(entry);
              }
            }
          } finally {
            await browser.close();
            server.close();
          }

          const report = (entry, kind) => {
            const where = entry.nodes.slice(0, 5).join(", ") + (entry.nodes.length > 5 ? `, and ${entry.nodes.length - 5} more` : "");
            console.log(`::${kind} title=${entry.rule} (${entry.impact}) on ${entry.page}::${entry.help}${where ? `: ${where}` : ""}${entry.url ? ` ${entry.url}` : ""}`);
          };
          for (const entry of notes) report(entry, "warning");
          for (const entry of failures) report(entry, "error");

          const cell = (text) => String(text).replaceAll("|", "\\|").replaceAll("\n", " ");
          const rows = [...failures, ...notes].map((e) =>
            `| ${cell(e.page)} | ${e.url ? `[${e.rule}](${e.url})` : e.rule} | ${e.impact} | ${cell(e.help)} | ${e.nodes.length} |`);
          const summary = [
            "## Accessibility",
            "",
            `${pages.length} ${pages.length === 1 ? "page" : "pages"} checked against WCAG 2.2 A and AA: ${failures.length} violations at ${levels[threshold]} impact or above, ${notes.length} below it.`,
            "",
            ...(rows.length ? ["| Page | Rule | Impact | Problem | Elements |", "| :--- | :--- | :--- | :--- | ---: |", ...rows] : []),
          ].join("\n");
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(summary);
          process.exitCode = failures.length > 0 ? 1 : 0;
          EOF
      - name: Check accessibility
        if: ${{ !cancelled() && inputs.check_accessibility && steps.site.outcome == 'success' }}
        env:
          SITE_ROOT: ${{ steps.site.outputs.root }}
          BASE_PATH: ${{ steps.site.outputs.base }}
          PAGES: ${{ inputs.accessibility_paths }}
          IMPACT: ${{ inputs.accessibility_impact }}
        run: node "$RUNNER_TEMP/a11y/check.mjs"

  patch:
    if: ${{ !failure() && !cancelled() && inputs.auto_patch && github.ref == 'refs/heads/main' }}
    needs: [quality, testing, build]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node.js version
        id: node
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: OSV Scanner Fix
        run: |
          curl -L https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner fix --non-interactive --strategy=in-place -L package-lock.json
          rm osv-scanner
          npm install --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit Security Patches
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "fix(deps): patch vulnerabilities via osv-scanner"
          file_pattern: 'package.json package-lock.json'
