name: library

# A library's checks: lint, scan, test and build. publish.yml ships the build.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        description: "Directory holding package.json"
        required: false
        type: string
        default: '.'
      node_version:
        description: "Node.js version; empty reads the project's .nvmrc, else Node 24"
        required: false
        type: string
        default: ''
      enable_secrets:
        description: "Scan for secrets with Gitleaks"
        required: false
        type: boolean
        default: true
      run_tests:
        description: "Run the test suite; init --no-testing sets it to false"
        required: false
        type: boolean
        default: true
      build_env_vars:
        description: "Lines written to .env before the build"
        required: false
        type: string
        default: ''
      artifact_name:
        description: "The build artifact's name, which publish, debian, pages and the check stage download"
        required: false
        type: string
        default: 'dist'
      ref:
        description: "Commit, branch or tag to check out; empty means the commit that triggered the run"
        required: false
        type: string
        default: ''
      setup_go:
        description: "Go to install before pre_build_command: a version (e.g. 1.25.x) or a go.mod, go.work, .go-version or .tool-versions path from the repository root; empty installs none"
        required: false
        type: string
        default: ''
      pre_build_command:
        description: "Shell command run in working_directory before installing dependencies, in every job that does; GH_TOKEN holds the GH_TOKEN secret if passed"
        required: false
        type: string
        default: ''
      test_windows:
        description: "Run the tests on Windows too: a runner label, e.g. windows-latest; empty skips it"
        required: false
        type: string
        default: ''
      test_macos:
        description: "Run the tests on macOS too: a runner label, e.g. macos-latest; empty skips it"
        required: false
        type: string
        default: ''
      test_versions:
        description: "A JSON array of other Node.js versions to run the tests on too, on Linux, e.g. '[\"26\"]'; empty skips them"
        required: false
        type: string
        default: ''
    secrets:
      GH_TOKEN:
        description: "A token pre_build_command can use, as GH_TOKEN"
        required: false

# nothing by default: every job asks for what it needs
permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node version
        id: node
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # a project scaffolded with --no-linting has no Biome config to lint against
      - name: Lint
        run: |
          if [ -f biome.json ] || [ -f biome.jsonc ]; then
            npx @biomejs/biome ci .
          else
            echo "No biome.json, skipping Biome"
          fi
      - name: Check types
        run: npm run type

  scan:
    name: scan
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      # Gitleaks comments on the pull request it finds a secret in
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scan with Gitleaks
        if: inputs.enable_secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # a pinned release, checked against the checksums it was published with
      - name: Install OSV-Scanner
        env:
          OSV_SCANNER_VERSION: v2.7.0
          ARCH: ${{ runner.arch }}
        run: |
          case "$ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::OSV-Scanner has no Linux build for $ARCH"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/osv-scanner"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION"
          curl -fsSLO "$base/osv-scanner_linux_$arch"
          curl -fsSLO "$base/osv-scanner_SHA256SUMS"
          sha256sum -c --ignore-missing osv-scanner_SHA256SUMS
          mv "osv-scanner_linux_$arch" osv-scanner
          chmod +x osv-scanner
      # A high or critical finding (CVSS 7 or more) fails a pull request; elsewhere it's annotated
      # instead, so releases still run while a Dependabot security update fixes it. Accept one with an
      # IgnoredVulns entry in an osv-scanner.toml beside the lockfile
      - name: Scan with OSV
        id: osv
        run: |
          # 0: nothing found, 1: vulnerabilities found, 128: no lockfile, anything else: no scan
          status=0
          "$RUNNER_TEMP/osv-scanner/osv-scanner" scan source -r --format json --output-file "$RUNNER_TEMP/osv.json" . || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Report OSV findings
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OSV_STATUS: ${{ steps.osv.outputs.status }}
          OSV_REPORT: ${{ runner.temp }}/osv.json
          OSV_ENFORCE: ${{ github.event_name == 'pull_request' }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const status = Number(process.env.OSV_STATUS);
            if (status === 128) {
              core.info('No lockfiles to scan');
              return;
            }
            // a pull request can't merge unchecked; elsewhere an outage at OSV mustn't stop a release
            if ((status !== 0 && status !== 1) || !fs.existsSync(process.env.OSV_REPORT)) {
              const incomplete = `OSV-Scanner couldn't finish (exit ${status}), so dependencies weren't checked; see the scan step's log`;
              if (process.env.OSV_ENFORCE === 'true') core.setFailed(incomplete);
              else core.warning(incomplete, { title: 'OSV scan incomplete' });
              return;
            }
            const report = JSON.parse(fs.readFileSync(process.env.OSV_REPORT, 'utf8'));
            // a GitHub advisory's rating when an advisory has no CVSS score
            const ratings = { CRITICAL: 9, HIGH: 7, MODERATE: 4, MEDIUM: 4, LOW: 1 };
            const rows = [];
            let blocking = 0;
            for (const result of report.results ?? []) {
              const file = path.relative(process.env.GITHUB_WORKSPACE, result.source.path);
              for (const { package: pkg, vulnerabilities = [], groups = [] } of result.packages ?? []) {
                for (const group of groups) {
                  const vulns = vulnerabilities.filter((v) => group.ids.includes(v.id));
                  let score = Number.parseFloat(group.max_severity);
                  if (Number.isNaN(score)) {
                    score = Math.max(0, ...vulns.map((v) => ratings[String(v.database_specific?.severity).toUpperCase()] ?? 0));
                  }
                  const high = score >= 7;
                  const message = `${pkg.name} ${pkg.version}: ${group.ids.join(', ')} ${vulns[0]?.summary ?? ''} (severity ${score || 'unknown'})`;
                  if (high) {
                    blocking++;
                    core.error(message, { title: 'High or critical vulnerability', file });
                  } else {
                    core.warning(message, { title: 'Vulnerability', file });
                  }
                  rows.push([file, `${pkg.name} ${pkg.version}`, group.ids.join(', '), String(score || 'unknown')]);
                }
              }
            }
            if (rows.length) {
              await core.summary
                .addHeading('OSV-Scanner findings', 3)
                .addTable([['Lockfile', 'Package', 'Advisories', 'Severity'], ...rows])
                .write();
            }
            const found = `${blocking} high or critical ${blocking === 1 ? 'vulnerability' : 'vulnerabilities'}`;
            if (blocking && process.env.OSV_ENFORCE === 'true') {
              core.setFailed(`${found}: update the packages, or record an accepted one in osv-scanner.toml`);
            } else if (blocking) {
              core.warning(`${found}: this fails pull requests until they're updated, as a Dependabot security update does`, { title: 'OSV scan' });
            } else {
              core.info(`${rows.length} found, none high or critical`);
            }
      # flags a pull request that adds a dependency with a known high or critical vulnerability; private
      # repositories need GitHub Code Security for it
      - name: Review dependencies
        if: github.event_name == 'pull_request' && github.event.repository.private == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high


  test:
    name: test
    if: inputs.run_tests
    needs: [lint, scan]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node version
        id: node
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: npm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/coverage
          if-no-files-found: ignore

  # The tests on Windows, macOS and other Node.js versions, each when asked. The test stage's run on Linux
  # uploads the coverage report, so these don't
  test-windows:
    name: test (windows)
    if: inputs.run_tests && inputs.test_windows != ''
    needs: [lint, scan]
    runs-on: ${{ inputs.test_windows }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node version
        id: node
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: npm test

  test-macos:
    name: test (macos)
    if: inputs.run_tests && inputs.test_macos != ''
    needs: [lint, scan]
    runs-on: ${{ inputs.test_macos }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node version
        id: node
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: npm test

  test-versions:
    name: test (${{ matrix.version }})
    if: inputs.run_tests && inputs.test_versions != ''
    needs: [lint, scan]
    runs-on: ${{ inputs.runs_on }}
    strategy:
      # each version's result, not just the first to fail
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.test_versions || '[]') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Resolve the Node version
        id: node
        env:
          INPUT: ${{ matrix.version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: npm test

  build:
    name: build
    # only needs the lint and scan to pass, so it runs alongside the tests
    needs: [lint, scan]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # the input if set, else the project's .nvmrc, else forgejs's default
      - name: Resolve the Node version
        id: node
        env:
          INPUT: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .nvmrc ]; then version=$(tr -d '[:space:]' < .nvmrc)
          else version=24
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
      - name: Set up Go
        if: inputs.setup_go != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # a path names a file to read the version from, anything else is the version itself
          go-version: ${{ !(endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          go-version-file: ${{ (endsWith(inputs.setup_go, 'go.mod') || endsWith(inputs.setup_go, 'go.work') || endsWith(inputs.setup_go, '.go-version') || endsWith(inputs.setup_go, '.tool-versions')) && inputs.setup_go || '' }}
          cache: false
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the build environment
        if: inputs.build_env_vars != ''
        # through the environment, so the value is never parsed as part of the script
        env:
          BUILD_ENV_VARS: ${{ inputs.build_env_vars }}
        run: printf '%s\n' "$BUILD_ENV_VARS" >> .env
      - name: Build
        run: npm run build
      # publint checks the built package and docs:check the generated API docs; projects without
      # these scripts skip them
      - name: Check the package
        run: |
          npm run --if-present publint
          npm run --if-present docs:check
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/dist
