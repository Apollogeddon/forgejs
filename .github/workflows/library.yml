name: NodeJS Library

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      enable_secrets:
        required: false
        type: boolean
        default: true
      node_version:
        required: false
        type: string
        default: '22'
      working_directory:
        required: false
        type: string
        default: '.'
      auto_patch:
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true
      enable_versioning:
        required: false
        type: boolean
        default: true
      build_env_vars:
        required: false
        type: string
        default: ''
      artifact_name:
        required: false
        type: string
        default: 'dist'
      publish:
        required: false
        type: boolean
        default: true

jobs:
  testing:
    uses: ./.github/workflows/testing.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      node_version: ${{ inputs.node_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      auto_patch: ${{ inputs.auto_patch }}
      build_env_vars: ${{ inputs.build_env_vars }}
      run_tests: ${{ inputs.run_tests }}
      artifact_name: ${{ inputs.artifact_name }}

  auto-merge:
    uses: ./.github/workflows/merge.yml
    with:
      runs_on: ${{ inputs.runs_on }}
    needs: [testing]
    permissions:
      contents: write
      pull-requests: write

  version:
    if: inputs.enable_versioning
    uses: ./.github/workflows/version.yml
    needs: [testing]
    with:
      runs_on: ${{ inputs.runs_on }}
      node_version: ${{ inputs.node_version }}
      working_directory: ${{ inputs.working_directory }}

  publish:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    needs: [version]
    if: inputs.publish && github.ref == 'refs/heads/main' && (needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true)
    permissions:
      contents: read
      id-token: write
      packages: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/dist
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
