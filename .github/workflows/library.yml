name: NodeJS Library

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      test_on_push:
        description: "Run the checks on pushes too; false runs them on pull requests (and scheduled runs) only"
        required: false
        type: boolean
        default: true
      test_release_prs:
        description: "Run the checks on release-please's release pull requests"
        required: false
        type: boolean
        default: true
      enable_secrets:
        required: false
        type: boolean
        default: true
      node_version:
        required: false
        type: string
        default: '22'
      working_directory:
        required: false
        type: string
        default: '.'
      auto_patch:
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true
      enable_versioning:
        required: false
        type: boolean
        default: true
      build_env_vars:
        required: false
        type: string
        default: ''
      artifact_name:
        required: false
        type: string
        default: 'dist'
      publish:
        required: false
        type: boolean
        default: true

jobs:
  testing:
    # With test_on_push false, a push checks only when a release is made, in release-testing.
    if: >-
      (github.event_name != 'push' || inputs.test_on_push) &&
      (inputs.test_release_prs || !startsWith(github.head_ref, 'release-please--'))
    uses: ./.github/workflows/testing.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      node_version: ${{ inputs.node_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      auto_patch: ${{ inputs.auto_patch }}
      build_env_vars: ${{ inputs.build_env_vars }}
      run_tests: ${{ inputs.run_tests }}
      artifact_name: ${{ inputs.artifact_name }}

  auto-merge:
    uses: ./.github/workflows/merge.yml
    with:
      runs_on: ${{ inputs.runs_on }}
    needs: [testing]
    permissions:
      contents: write
      pull-requests: write

  version:
    # Runs when the checks were skipped, as on a push to main with test_on_push false, but not when they failed.
    if: ${{ !failure() && !cancelled() && inputs.enable_versioning }}
    uses: ./.github/workflows/version.yml
    needs: [testing]
    with:
      runs_on: ${{ inputs.runs_on }}
      node_version: ${{ inputs.node_version }}
      working_directory: ${{ inputs.working_directory }}

  release-testing:
    # With test_on_push false, a push to main is checked and built only when release-please made a release.
    needs: [version]
    if: >-
      !cancelled() && github.event_name == 'push' && !inputs.test_on_push &&
      (needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true)
    uses: ./.github/workflows/testing.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      node_version: ${{ inputs.node_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      auto_patch: ${{ inputs.auto_patch }}
      build_env_vars: ${{ inputs.build_env_vars }}
      run_tests: ${{ inputs.run_tests }}
      artifact_name: ${{ inputs.artifact_name }}

  publish:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    needs: [testing, version, release-testing]
    if: ${{ !failure() && !cancelled() && (needs.testing.result == 'success' || needs['release-testing'].result == 'success') && inputs.publish && github.ref == 'refs/heads/main' && (needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true) }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/dist
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: "@${{ github.repository_owner }}"
          # no dependency cache in a job holding a publish token, as a poisoned cache could ship
          package-manager-cache: false
      # publishes the tested build artifact as is: no install and no lifecycle scripts,
      # so no dependency code runs while the publish token is set
      - name: Publish to GitHub Packages
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
