name: patch

# Retired: Dependabot security updates now open a pull request for each vulnerable dependency, which the checks
# and merge.yml handle like any other update. Kept, with its inputs, so a project still calling it doesn't fail.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        description: "Unused; kept so existing callers stay valid"
        required: false
        type: string
        default: '.'
      node_version:
        description: "Unused; kept so existing callers stay valid"
        required: false
        type: string
        default: ''

# nothing by default: every job asks for what it needs
permissions: {}

jobs:
  update:
    name: update
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain the change
        run: |
          echo "::warning title=patch is retired::patch no longer changes anything: turn on Dependabot security updates (Settings → Code security → Dependabot security updates), which open a pull request for each vulnerable dependency, and remove the patch job from .github/workflows/.index.yml"
