version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Limit open PRs to prevent flooding
    open-pull-requests-limit: 10
    groups:
      # These packages must stay on matching versions - group them at any update
      # type so Dependabot never proposes one half of a pair without the other.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
      commitlint:
        patterns:
          - "@commitlint/cli"
          - "@commitlint/config-conventional"
      js-yaml:
        patterns:
          - "js-yaml"
          - "@types/js-yaml"
      # Group remaining non-major updates to reduce PR volume
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ensure commit messages follow your convention (e.g., 'chore(deps): ...')
    # TypeScript is pinned to 6 until 7 is tested here; tsdown already supports it.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    commit-message:
      prefix: "fix(deps)"
    # Wait 3 days after a version is published before proposing it, so a
    # compromised release has time to be caught/yanked upstream first.
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "apollogeddon/forgejs"
    cooldown:
      default-days: 3